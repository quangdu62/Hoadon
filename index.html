<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bản Quyền Kích Hoạt Tự Động - Quang Vinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #ffffff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .login-box h3 { text-align: center; color: #1e3a8a; font-size: 18px; text-transform: uppercase; margin-bottom: 5px; }
        .login-group { display: flex; flex-direction: column; gap: 4px; }
        .login-group label { font-size: 12px; font-weight: bold; color: #475569; }
        .login-group input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .login-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .btn-action { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
        .btn-action:hover { background: #1d4ed8; }
        .btn-activate { background: #16a34a; }
        .btn-activate:hover { background: #15803d; }
        #login-error { color: #dc2626; font-size: 13px; text-align: center; min-height: 16px; line-height: 1.4; }
        .sidebar { width: 420px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; box-shadow: 6px 0 25px rgba(0, 0, 0, 0.2); z-index: 10; }
        .note-quangdu { font-size: 18px; font-weight: bold; color: #000000; text-transform: uppercase; line-height: 1.4; padding: 16px; background: #fef2f2; border-left: 6px solid #dc2626; border-radius: 6px; }
        .user-info-badge { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 6px; font-size: 13px; color: #1e3a8a; display: flex; flex-direction: column; gap: 4px; }
        .user-info-badge div { display: flex; justify-content: space-between; }
        .key-status-badge { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; font-size: 13px; color: #334155; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .key-input-box { background: #f8fafc; border: 1px dashed #94a3b8; padding: 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
        .key-input-box label { font-size: 12px; font-weight: bold; color: #334155; text-transform: uppercase; }
        .key-input-box input { padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .btn-logout { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: auto; }
        .btn-logout:hover { background: #b91c1c; }
        .main-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #e2e8f0; color: #1e293b; font-size: 24px; font-weight: bold; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / KÍCH HOẠT KEY -->
    <div id="login-overlay" style="display: none;">
        <div class="login-box">
            <h3 id="form-title">Đăng nhập hệ thống</h3>
            
            <div id="login-fields">
                <div class="login-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="login-user" placeholder="Nhập tên đăng nhập...">
                </div>
                <div class="login-group" style="margin-top: 8px;">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-pass" placeholder="Nhập mật khẩu...">
                </div>
            </div>

            <div id="key-activate-fields" style="display: none; margin-top: 5px;">
                <div class="login-group">
                    <label style="color: #dc2626;">Nhập Mã Key Bản Quyền Mới</label>
                    <input type="text" id="activate-key-input" placeholder="Nhập mã Key gia hạn tại đây...">
                </div>
            </div>

            <div id="login-error"></div>

            <button class="btn-action" id="btn-submit-login" onclick="handleLogin()">Đăng nhập</button>
            <button class="btn-action btn-activate" id="btn-submit-key" onclick="handleActivateKeyOverlay()" style="display: none;">Kích Hoạt Key</button>
        </div>
    </div>

    <!-- CỘT BÊN TRÁI -->
    <div class="sidebar">
        <div class="note-quangdu">
            HỆ THỐNG BẢN QUYỀN<br>
            <span style="font-size: 13px; color: #555; text-transform: none;">Liên hệ Quang Dự: 0988.057.750</span>
        </div>

        <div class="user-info-badge">
            <div><span>Tài khoản:</span> <b id="display-user-name">Chưa đăng nhập</b></div>
        </div>

        <div class="key-status-badge">
            <span>Trạng thái bản quyền:</span>
            <b id="key-expiry-display" style="color: #2563eb;">Đang kiểm tra...</b>
        </div>

        <div class="key-input-box">
            <label>Nạp / Gia Hạn Key Trực Tiếp</label>
            <input type="text" id="sidebar-key-input" placeholder="Nhập mã Key mới...">
            <button class="btn-action btn-activate" onclick="handleSidebarKeyUpdate()" style="padding: 8px; font-size: 13px;">Kích Hoạt Key</button>
            <button class="btn-action" onclick="manualSyncData()" style="background: #475569; padding: 8px; font-size: 12px; margin-top: 4px;">🔄 Đồng Bộ Lại Ngay</button>
        </div>

        <button class="btn-logout" onclick="handleLogout()">Đăng xuất / Đổi tài khoản</button>
    </div>

    <div class="main-area">
        <div>
            🎉 ĐĂNG NHẬP THÀNH CÔNG!<br>
            <span style="font-size: 16px; font-weight: normal; color: #475569; margin-top: 10px; display: block;">
                Tự động ghi nhận Key & Cập nhật số ngày trực tiếp lên Google Sheets (0 giây).
            </span>
        </div>
    </div>

    <script>
        // Đường link Google Apps Script mới của anh
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSNT99dYifCMmJ4CH7-By1IHZe7Wua8m3A1HvpHpo93OamSlxY80XVP0sYQNYNhxGw/exec";

        function getFreshApiUrl() {
            return APPS_SCRIPT_URL + "?t=" + new Date().getTime();
        }

        function parseDateString(dateStr) {
            if (!dateStr) return null;
            let cleanStr = dateStr.toString().trim();
            let dObj = new Date(cleanStr);
            if (!isNaN(dObj.getTime())) {
                dObj.setHours(23, 59, 59, 999);
                return dObj;
            }
            let parts = cleanStr.split(/[\/\-]/);
            if (parts.length === 3) {
                let day = parseInt(parts[0], 10);
                let month = parseInt(parts[1], 10) - 1;
                let year = parseInt(parts[2], 10);
                let parsedDate = new Date(year, month, day, 23, 59, 59);
                if (!isNaN(parsedDate.getTime())) return parsedDate;
            }
            return null;
        }

        async function fetchUserData(user, pass) {
            try {
                let response = await fetch(getFreshApiUrl());
                let data = await response.json();
                let users = data.users || [];

                for (let i = 0; i < users.length; i++) {
                    if (users[i].user.toLowerCase() === user.toLowerCase() && users[i].pass === pass) {
                        let expDateObj = parseDateString(users[i].date);
                        let daysLeft = 0;
                        if (expDateObj) {
                            let today = new Date();
                            today.setHours(0, 0, 0, 0);
                            let diff = expDateObj.getTime() - today.getTime();
                            daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                        }
                        return { 
                            found: true, 
                            daysLeft: daysLeft > 0 ? daysLeft : 0, 
                            expiryDate: users[i].date 
                        };
                    }
                }
            } catch (e) {
                console.error("Lỗi fetch:", e);
            }
            return { found: false, daysLeft: 0, expiryDate: "" };
        }

        async function activateKeyOnServer(user, key) {
            try {
                let response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ user: user, key: key })
                });
                let result = await response.json();
                return result;
            } catch (e) {
                console.error("Lỗi POST:", e);
                return { success: false, message: "Không kết nối được tới máy chủ!" };
            }
        }

        async function checkLoginSession() {
            let savedUser = localStorage.getItem("quangvinh_logged_user");
            let savedPass = localStorage.getItem("quangvinh_logged_pass");

            if (savedUser) {
                document.getElementById('display-user-name').innerText = savedUser;

                if (savedUser === "haiyen" && savedPass === "123456") {
                    document.getElementById('key-expiry-display').innerHTML = `<span style="color: #2563eb;">Admin Master</span>`;
                    document.getElementById('login-overlay').style.display = 'none';
                    return;
                }

                let userStatus = await fetchUserData(savedUser, savedPass);
                if (userStatus.found && userStatus.daysLeft > 0) {
                    updateKeyBadgeDisplay(userStatus.daysLeft, userStatus.expiryDate);
                    document.getElementById('login-overlay').style.display = 'none';
                    return;
                }
            }
            showLoginForm();
        }

        async function handleLogin() {
            let user = document.getElementById('login-user').value.trim();
            let pass = document.getElementById('login-pass').value.trim();
            let errDiv = document.getElementById('login-error');

            if (!user || !pass) {
                errDiv.innerText = "Vui lòng nhập Tên đăng nhập và Mật khẩu!";
                return;
            }

            if (user === "haiyen" && pass === "123456") {
                localStorage.setItem("quangvinh_logged_user", user);
                localStorage.setItem("quangvinh_logged_pass", pass);
                document.getElementById('display-user-name').innerText = user;
                document.getElementById('key-expiry-display').innerHTML = `<span style="color: #2563eb;">Admin Master</span>`;
                document.getElementById('login-overlay').style.display = 'none';
                return;
            }

            errDiv.innerText = "Đang kiểm tra tài khoản...";
            let userStatus = await fetchUserData(user, pass);

            if (!userStatus.found) {
                errDiv.innerText = "Sai tên đăng nhập hoặc mật khẩu!";
                return;
            }

            localStorage.setItem("quangvinh_logged_user", user);
            localStorage.setItem("quangvinh_logged_pass", pass);
            document.getElementById('display-user-name').innerText = user;

            if (userStatus.daysLeft > 0) {
                updateKeyBadgeDisplay(userStatus.daysLeft, userStatus.expiryDate);
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                showKeyActivationForm("Tài khoản của bạn đã HẾT HẠN! Nhập Key để nạp thêm ngày.");
            }
        }

        async function handleActivateKeyOverlay() {
            let keyInput = document.getElementById('activate-key-input').value.trim();
            let errDiv = document.getElementById('login-error');
            let user = localStorage.getItem("quangvinh_logged_user") || document.getElementById('login-user').value.trim();

            if (!keyInput) {
                errDiv.innerText = "Vui lòng nhập mã Key!";
                return;
            }

            errDiv.innerText = "Đang kích hoạt Key trên Google Sheets...";
            let res = await activateKeyOnServer(user, keyInput);

            if (res.success) {
                alert(`Kích hoạt thành công!\n+ Thêm ${res.addedDays} ngày bản quyền.\n+ Hạn mới đến ngày: ${res.newExpiry}`);
                let userStatus = await fetchUserData(user, localStorage.getItem("quangvinh_logged_pass"));
                updateKeyBadgeDisplay(userStatus.daysLeft, userStatus.expiryDate);
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                errDiv.innerText = res.message;
            }
        }

        async function handleSidebarKeyUpdate() {
            let keyInput = document.getElementById('sidebar-key-input').value.trim();
            let currentUser = localStorage.getItem("quangvinh_logged_user");

            if (!keyInput) {
                alert("Vui lòng nhập mã Key mới!");
                return;
            }

            let badge = document.getElementById('key-expiry-display');
            badge.innerHTML = `<span style="color: #2563eb;">Đang xử lý kích hoạt...</span>`;

            let res = await activateKeyOnServer(currentUser, keyInput);
            if (res.success) {
                alert(`Kích hoạt thành công!\n+ Thêm ${res.addedDays} ngày.\n+ Hạn mới: ${res.newExpiry}`);
                document.getElementById('sidebar-key-input').value = "";
                let userStatus = await fetchUserData(currentUser, localStorage.getItem("quangvinh_logged_pass"));
                updateKeyBadgeDisplay(userStatus.daysLeft, userStatus.expiryDate);
            } else {
                alert(res.message);
                manualSyncData();
            }
        }

        async function manualSyncData() {
            let currentUser = localStorage.getItem("quangvinh_logged_user");
            let currentPass = localStorage.getItem("quangvinh_logged_pass");

            if (!currentUser) return;

            let badge = document.getElementById('key-expiry-display');
            badge.innerHTML = `<span style="color: #2563eb;">Đang đồng bộ...</span>`;

            let userStatus = await fetchUserData(currentUser, currentPass);
            if (userStatus.found) {
                updateKeyBadgeDisplay(userStatus.daysLeft, userStatus.expiryDate);
                alert("Đồng bộ thành công!");
            } else {
                alert("Không tìm thấy dữ liệu tài khoản!");
            }
        }

        function updateKeyBadgeDisplay(totalDays, latestDate) {
            let badge = document.getElementById('key-expiry-display');
            if (!badge) return;
            if (totalDays > 0) {
                badge.innerHTML = `<span style="color: #16a34a;">Còn ${totalDays} ngày (Đến ${latestDate})</span>`;
            } else {
                badge.innerHTML = `<span style="color: #dc2626;">Đã hết hạn</span>`;
            }
        }

        function showLoginForm() {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('form-title').innerText = "Đăng nhập hệ thống";
            document.getElementById('login-fields').style.display = 'block';
            document.getElementById('key-activate-fields').style.display = 'none';
            document.getElementById('btn-submit-login').style.display = 'block';
            document.getElementById('btn-submit-key').style.display = 'none';
            document.getElementById('login-error').innerText = "";
        }

        function showKeyActivationForm(msg) {
            document.getElementById('form-title').innerText = "Kích Hoạt Bản Quyền";
            document.getElementById('login-fields').style.display = 'none';
            document.getElementById('key-activate-fields').style.display = 'block';
            document.getElementById('btn-submit-login').style.display = 'none';
            document.getElementById('btn-submit-key').style.display = 'block';
            document.getElementById('login-error').innerText = msg;
        }

        function handleLogout() {
            localStorage.removeItem("quangvinh_logged_user");
            localStorage.removeItem("quangvinh_logged_pass");
            location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkLoginSession();
        });
    </script>
</body>
</html>
